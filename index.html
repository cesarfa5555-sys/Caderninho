<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Caderninho — Purytalent</title>
  <meta name="description" content="Controle seu dinheiro do jeito simples: anote, lembre das contas e cobre pelo WhatsApp.">
  <meta name="theme-color" content="#1f7a4d">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="features.css">
</head>
<body>
  <!-- Animação de abertura (só CSS; some sozinha. Toque para pular). -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-center">
      <svg class="splash-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" focusable="false">
        <rect class="sp-bg" width="512" height="512" rx="112" fill="#1f7a4d"/>
        <rect class="sp-page" x="128" y="88" width="256" height="336" rx="28" fill="#fffdf6"/>
        <rect class="sp-spine" x="128" y="88" width="48" height="336" rx="24" fill="#f2b632"/>
        <g stroke="#e7dfca" stroke-width="8" stroke-linecap="round" fill="none">
          <line class="sp-line l1" x1="208" y1="160" x2="352" y2="160"/>
          <line class="sp-line l2" x1="208" y1="208" x2="352" y2="208"/>
          <line class="sp-line l3" x1="208" y1="368" x2="352" y2="368"/>
        </g>
        <path class="sp-check" d="M214 292l36 36 70-86" stroke="#1f7a4d" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="sp-spark s1" cx="416" cy="96" r="12" fill="#f2b632"/>
        <circle class="sp-spark s2" cx="100" cy="440" r="9" fill="#f2b632"/>
        <circle class="sp-spark s3" cx="440" cy="400" r="7" fill="#2f9e6a"/>
      </svg>
      <h1 class="splash-name">Caderninho</h1>
      <p class="splash-sub">Seu dinheiro do jeito simples</p>
    </div>
    <p class="splash-credit">desenvolvido por <b>N E K Purytalent</b></p>
  </div>

  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="#/home" aria-label="Caderninho — início">
        <img class="brand-ico" src="icon.svg" alt="" aria-hidden="true">
        <span class="brand-name">Caderninho</span>
      </a>
      <div class="topbar-right">
        <a class="chip-net" id="netChip" href="#/perfil" hidden></a>
        <a class="chip-streak" id="streakChip" href="#/perfil" aria-label="Sua sequência"><i data-ic="sprout"></i> <b>0</b></a>
        <a class="avatar" id="avatar" href="#/perfil" aria-label="Seu perfil"><i data-ic="user"></i></a>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Menu principal">
      <a href="#/home" data-route="home"><i data-ic="home"></i><small>Início</small></a>
      <a href="#/lancamentos" data-route="lancamentos"><i data-ic="book"></i><small>Anotações</small></a>
      <button type="button" class="fab" data-action="tx:new" data-type="out" aria-label="Anotar entrada ou saída"><i data-ic="plus"></i></button>
      <a href="#/contas" data-route="contas"><i data-ic="receipt"></i><small>Contas</small></a>
      <a href="#/resumo" data-route="resumo"><i data-ic="chart"></i><small>Resumo</small></a>
    </nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Ordem importa: cada arquivo usa o anterior. Sem build, sem dependências. -->
  <script src="utils.js"></script>
  <script src="icons.js"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
  <script src="qr.js"></script>
  <script src="pix.js"></script>
  <script src="forms.js"></script>
  <script src="home.js"></script>
  <script src="transactions.js"></script>
  <script src="bills.js"></script>
  <script src="summary.js"></script>
  <script src="goals.js"></script>
  <script src="profile.js"></script>
  <script src="sync.js"></script>
  <script src="offline.js"></script>
  <script src="app.js"></script>
</body>
</html>
